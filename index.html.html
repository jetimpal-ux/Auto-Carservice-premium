<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

            th, td { padding: 4px; text-align: left; }

</head>
<body class="pb-24">

    <div id="tab-database" class="tab-content">

<div class="mt-6 p-4 bg-zinc-900/50 rounded-3xl border border-zinc-800">

        <!-- Data piutang akan muncul di sini -->
    </div>
</div>
        <div id="jurnal-summary-area" class="mb-6"></div>

        <div class="space-y-4">

                <div id="jurnal-in-body" class="space-y-2 text-[10px]"></div>

                <div id="jurnal-out-body" class="space-y-2 text-[10px]"></div>

        </div>
    </div>

        <h3 id="modal-title" class="text-lg font-bold text-orange-500 mb-6 uppercase italic">Modal</h3>
        <div id="modal-body" class="space-y-4"></div>
        <div class="flex flex-col gap-2 mt-8">

            Servis

        document.getElementById('list-stok').innerHTML = st.map(i => `<div class="card-dark p-3 rounded-2xl border-l-4 ${i.jumlah_stok < 5 ? 'border-red-600' : 'border-blue-500'} flex justify-between items-center"><div><p class="text-[8px] text-zinc-500 uppercase">${i.nama_barang}</p><h4 class="text-base font-black">${i.jumlah_stok}</h4></div><button onclick="window.hapus('stok_sparepart','${i.id}')" class="text-zinc-800"><i class="fa-solid fa-trash"></i></button></div>`).join('');
        window.renderWorkshop(); window.updateFinanceUI();

    window.renderWorkshop = () => {
        const query = document.getElementById('search-ws').value.toUpperCase();
        const filtered = masterS.filter(x => x.kendaraan?.plat?.toUpperCase().includes(query));
        document.getElementById('list-pro-workshop').innerHTML = filtered.map(x => {
            const tot = (x.jasa_service || 0) + (x.biaya_sparepart || 0), sisa = tot - (x.uang_muka || 0);
            return `<div class="card-dark p-5 rounded-[1.5rem] border-l-4 ${sisa > 0 ? 'border-red-600' : 'border-emerald-600'}">
                <div class="flex justify-between items-start">
                    <div><h3 class="text-lg font-black text-orange-500 italic">${x.kendaraan?.plat}</h3><p class="text-[9px] text-zinc-500 uppercase">${x.kendaraan?.pelanggan?.nama || '-'}</p></div>
                    <button onclick="window.printNotaFull('${x.id}')" class="text-orange-500"><i class="fa-solid fa-print"></i></button>
                                </div>

                    ${sisa > 0 ? `<button onclick="window.bayarSisaModal('${x.id}', ${sisa})" class="bg-red-600 text-white px-3 py-1 rounded text-[8px] font-bold uppercase">Lunasi</button>` : '<span class="text-emerald-500 text-[10px] font-black italic">LUNAS</span>'}

                </div></div>`;
        }).join('');

    window.updateFinanceUI = () => {
    const f = document.getElementById('filter-finance').value, now = new Date();
    
    // 1. Data Filtered (Hanya untuk rincian daftar di bawah)
    const fS = masterS.filter(x => { 
        const d = new Date(x.created_at); 
        return f==='hari'?d.toDateString()===now.toDateString():f==='bulan'?d.getMonth()===now.getMonth():true; 
    });
    const fE = masterE.filter(x => { 
        const d = new Date(x.created_at); 
        return f==='hari'?d.toDateString()===now.toDateString():f==='bulan'?d.getMonth()===now.getMonth():true; 
    });
       
    // 2. HITUNG SALDO KESELURUHAN (KUMULATIF)
    // Kita hitung dari 'masterS' dan 'masterE' tanpa filter waktu agar saldo terus berlanjut

    let totalModalSemua = 0;
    let totalKeluarSemua = 0;

    masterS.forEach(x => {
        if(x.metode_bayar === 'Transfer') totalBankSemua += parseInt(x.uang_muka || 0);
        else totalTunaiSemua += parseInt(x.uang_muka || 0);
    });

    masterE.forEach(x => {
        if(x.nominal < 0) totalModalSemua += Math.abs(x.nominal);
        else totalKeluarSemua += parseInt(x.nominal || 0);
    });

    // Rumus Saldo Akhir (Semua Uang Masuk - Semua Uang Keluar)
    const saldoBerlanjut = (totalTunaiSemua + totalModalSemua) - totalKeluarSemua;
    
    // Hitung Pemasukan Khusus Filter (Hari/Bulan ini saja)
    let tunaiFilter = 0, bankFilter = 0;
    fS.forEach(x => {
        if(x.metode_bayar === 'Transfer') bankFilter += parseInt(x.uang_muka || 0);
        else tunaiFilter += parseInt(x.uang_muka || 0);
    });
    const pemasukanSementara = tunaiFilter + bankFilter;

    const daftarPiutang = masterS.filter(x => {
        const total = parseInt(x.jasa_service || 0) + parseInt(x.biaya_sparepart || 0);
        return parseInt(x.uang_muka || 0) < total;
    });

    const targetDiv = document.getElementById('list-piutang');
    if (targetDiv) {
        targetDiv.innerHTML = daftarPiutang.length ? daftarPiutang.map(x => {

                        <p class="text-[8px] text-zinc-500 uppercase">${x.kendaraan?.pelanggan?.nama || '-'}</p>

                    <div class="text-right">
                        <p class="text-[10px] font-black text-red-500">Rp ${sisa.toLocaleString()}</p>
                        <button onclick="window.bayarSisaModal('${x.id}', ${sisa})" class="text-[7px] bg-red-600 text-white px-2 py-1 rounded mt-1 uppercase font-bold">Lunasi</button>

        }).join('') : `<p class="text-[9px] text-zinc-600 italic text-center">Semua tagihan lunas.</p>`;

    // TAMPILKAN KE UI
    document.getElementById('jurnal-summary-area').innerHTML = `
        <div class="card-dark p-6 rounded-[2rem] border-l-4 border-emerald-500 bg-emerald-950/5">

            <div class="mt-4 pt-4 border-t border-white/5 space-y-3">

                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-[7px] text-zinc-500 uppercase">Tunai (${f})</p>
                        <p class="text-xs font-bold text-white">Rp ${tunaiFilter.toLocaleString()}</p>
                    </div>
                    <div>
                        <p class="text-[7px] text-zinc-500 uppercase">Transfer (${f})</p>
                        <p class="text-xs font-bold text-blue-500">Rp ${bankFilter.toLocaleString()}</p>
                    </div>
                </div>
            </div>
        </div>`;

    // Render rincian daftar In/Out (tetap menggunakan filter agar tidak kepanjangan)
    document.getElementById('jurnal-in-body').innerHTML = fS.map(x => `
        <div class="flex justify-between border-b border-white/5 pb-2">
            <div><span class="font-bold text-zinc-300">${x.kendaraan?.plat}</span><br><span class="text-[8px] text-zinc-500">${x.metode_bayar}</span></div>
            <span class="font-bold text-emerald-500">Rp ${parseInt(x.uang_muka).toLocaleString()}</span>
        </div>`).join('');

    document.getElementById('jurnal-out-body').innerHTML = fE.map(x => `
        <div class="flex justify-between border-b border-white/5 pb-2">
            <span class="${x.nominal < 0 ? 'text-emerald-400' : ''}">${x.keterangan}</span>
            <span class="font-bold ${x.nominal < 0 ? 'text-emerald-400' : 'text-red-500'}">Rp ${Math.abs(x.nominal).toLocaleString()}</span>
        </div>`).join('');
};

// 2. Tampilkan ke layar
const labelTotalE = document.getElementById('total-pengeluaran-filter');
if (labelTotalE) {
    labelTotalE.innerText = `Rp ${totalKeluarHarian.toLocaleString()}`;
}
    window.printJurnalReport = () => {
        const f = document.getElementById('filter-finance').value, now = new Date();
        const fS = masterS.filter(x => { const d = new Date(x.created_at); return f==='hari'?d.toDateString()===now.toDateString():f==='bulan'?d.getMonth()===now.getMonth():true; });

        let tunai = 0, bank = 0, keluar = 0, modal = 0;
        fS.forEach(x => { if(x.metode_bayar==='Transfer') bank += parseInt(x.uang_muka || 0); else tunai += parseInt(x.uang_muka || 0); });
        fE.forEach(x => { if(x.nominal < 0) modal += Math.abs(x.nominal); else keluar += parseInt(x.nominal || 0); });

    window.openModal = async (type, id = null) => {
        const b = document.getElementById('modal-body'), t = document.getElementById('modal-title'), btn = document.getElementById('btn-execute');
        document.getElementById('modal-container').classList.remove('hidden');
        
        if(type==='tambah_modal'){ t.innerText="Tambah Modal Kas"; b.innerHTML=`<input id="m-ket" placeholder="Keterangan"><input id="m-nom" type="number" placeholder="Nominal (Rp)">`; btn.onclick=async()=>{ await supabase.from('pengeluaran').insert([{keterangan:"[MODAL] "+document.getElementById('m-ket').value, nominal:-Math.abs(document.getElementById('m-nom').value)}]); window.closeModal(); window.loadAll();};}
        else if(type==='pengeluaran'){ t.innerText="Catat Biaya"; b.innerHTML=`<input id="e-ket" placeholder="Keterangan Pengeluaran"><input id="e-nom" type="number" placeholder="Nominal (Rp)">`; btn.onclick=async()=>{ await supabase.from('pengeluaran').insert([{keterangan:document.getElementById('e-ket').value, nominal:document.getElementById('e-nom').value}]); window.closeModal(); window.loadAll();};}
        if(type==='pelanggan'){ 
    t.innerText = "Pelanggan Baru"; 
    b.innerHTML = `
        <input id="p-nama" placeholder="Nama Pelanggan">
        <input id="p-merek" placeholder="Merek Mobil (Contoh: Toyota Avanza)">
        <input id="p-hp" type="tel" placeholder="Nomor HP (WhatsApp)">
    `; 
    btn.onclick = async () => { 
        const nama = document.getElementById('p-nama').value;
        const merek = document.getElementById('p-merek').value;
        const hp = document.getElementById('p-hp').value;

        if(!nama) return alert("Nama harus diisi!");

        await supabase.from('pelanggan').insert([{
            nama: nama, 
            merek_mobil: merek, 
            no_hp: hp
        }]); 
        
        window.closeModal(); 
        window.loadAll();
    };
}
        else if(type==='kendaraan'){ 
    const { data: pL } = await supabase.from('pelanggan').select('*').order('nama');
    t.innerText = "Unit Baru"; 
    b.innerHTML = `
        <label class="text-[10px] text-zinc-500 font-bold uppercase ml-2">Pilih Pemilik</label>
        <select id="p-sel">
            <option value="">-- Pilih Pelanggan --</option>
            ${pL.map(x => `<option value="${x.id}">${x.nama} [${x.merek_mobil || '-'}]</option>`).join('')}
        </select>
        <input id="p-plat" class="uppercase" placeholder="Plat Nomor (Contoh: DB 1234 XX)">
    `;
    btn.onclick = async () => { 
        const pelangganId = document.getElementById('p-sel').value;
        const plat = document.getElementById('p-plat').value.toUpperCase();

        if(!pelangganId || !plat) return alert("Pilih pelanggan dan isi plat nomor!");

        await supabase.from('kendaraan').insert([{
            pelanggan_id: pelangganId, 
            plat: plat
        }]); 
        window.closeModal(); 
        window.loadAll();
    };
}
        else if(type==='servis'){
            t.innerText="Workshop Input"; 
            b.innerHTML=`
                <input id="s-kel" placeholder="Pekerjaan / Keluhan">
                <input id="s-jasa" type="number" placeholder="Jasa (Rp)" oninput="window.calc()">
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800">
                    <div id="spare-area"></div>
                    <div id="bsk" class="mt-2 text-[10px] text-zinc-400"></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <select id="s-met">
                        <option value="Tunai">💰 Tunai</option>
                        <option value="Transfer">🏦 Transfer</option>
                    </select>
                    <input id="s-bayar" type="number" placeholder="Bayar (Rp)" oninput="window.calc()">
                </div>
                <p id="v-sisa" class="text-[10px] text-red-500 font-bold italic">Sisa Tagihan: Rp 0</p>`;
            
            window.updateSpareArea(false);

            btn.onclick = async () => {
                const jasaVal = parseInt(document.getElementById('s-jasa').value || 0);
                const bayarVal = parseInt(document.getElementById('s-bayar').value || 0);
                const totPart = keranjang.reduce((a, b) => a + (b.harga * b.qty), 0);
                
                // Menggabungkan rincian keranjang menjadi satu teks panjang
                const teksRincian = keranjang.map(i => `${i.nama} (Rp ${i.harga.toLocaleString()}) x${i.qty}`).join(" | ");

                const { data: n } = await supabase.from('servis').insert([{
                    kendaraan_id: id, 
                    keluhan: document.getElementById('s-kel').value, 
                    jasa_service: jasaVal, 
                    biaya_sparepart: totPart, 
                    uang_muka: bayarVal, 
                    metode_bayar: document.getElementById('s-met').value,
                    nama_sparepart_manual: teksRincian // Disimpan ke kolom yang sudah ada di gambar Anda
                }]).select().single();

                // Potong stok gudang jika ada
                for(let it of keranjang){
                    if(it.stok_id){ 
                        const {data:c}=await supabase.from('stok_sparepart').select('jumlah_stok').eq('id',it.stok_id).single(); 
                        await supabase.from('stok_sparepart').update({jumlah_stok:c.jumlah_stok-it.qty}).eq('id',it.stok_id); 
                    }
                }
                window.closeModal(); window.loadAll();
            };
        }
        else if(type==='stok'){ t.innerText="Tambah Stok"; b.innerHTML=`<input id="st-n" placeholder="Nama Barang"><input id="st-h" type="number" placeholder="Harga Jual Satuan"><input id="st-j" type="number" placeholder="Jumlah Stok">`; btn.onclick=async()=>{ await supabase.from('stok_sparepart').insert([{nama_barang:document.getElementById('st-n').value, harga_jual_satuan:document.getElementById('st-h').value, jumlah_stok:document.getElementById('st-j').value, satuan:'Pcs'}]); window.closeModal(); window.loadAll();};}
    };

    window.updateSpareArea = async (m) => {
        const a = document.getElementById('spare-area');
        if(m) { a.innerHTML=`<input id="m-n" placeholder="Part Luar"><input id="m-h" type="number" placeholder="Harga"><button onclick="window.addM()" class="w-full orange-gradient py-2 rounded-lg mt-2 text-[10px] font-bold">Add Manual</button><button onclick="window.updateSpareArea(false)" class="text-[8px] text-blue-400 mt-2 block">Cek Stok Gudang</button>`; }
        else {
            const {data:st}=await supabase.from('stok_sparepart').select('*');
            a.innerHTML=`<select id="v-sp">${st.map(x=>`<option value="${x.id}" data-h="${x.harga_jual_satuan}">${x.nama_barang} (${x.jumlah_stok})</option>`).join('')}</select><input id="v-q" type="number" value="1"><button onclick="window.addG()" class="w-full bg-blue-600 py-2 rounded-lg mt-2 text-[10px] font-bold">Add Part</button><button onclick="window.updateSpareArea(true)" class="text-[8px] text-orange-400 mt-2 block">+ Input Manual Part Luar</button>`;
        }
    };
    window.addG=()=>{ const s=document.getElementById('v-sp').selectedOptions[0]; keranjang.push({stok_id:s.value, nama:s.text.split(' (')[0], harga:parseInt(s.dataset.h), qty:parseInt(document.getElementById('v-q').value)}); window.renderBsk(); window.calc(); };
    window.addM=()=>{ keranjang.push({stok_id:null, nama:document.getElementById('m-n').value, harga:parseInt(document.getElementById('m-h').value), qty:1}); window.renderBsk(); window.calc(); };
    window.renderBsk=()=>{ document.getElementById('bsk').innerHTML=keranjang.map(i=>`<div>• ${i.nama} x${i.qty} (Rp ${(i.harga*i.qty).toLocaleString()})</div>`).join(''); };
    
    window.calc=()=>{
        const totP = keranjang.reduce((a,b)=>a+(b.harga*b.qty),0);
        const jasa = parseInt(document.getElementById('s-jasa')?.value || 0);
        const bayar = parseInt(document.getElementById('s-bayar')?.value || 0);
        const sisa = (totP + jasa) - bayar;
        document.getElementById('v-sisa').innerText = "Sisa Tagihan: Rp " + sisa.toLocaleString();
    };

    window.bayarSisaModal = (id, sisaAwal) => {
        const title = document.getElementById('modal-title'), body = document.getElementById('modal-body'), btn = document.getElementById('btn-execute');
        document.getElementById('modal-container').classList.remove('hidden');
        title.innerText = "Pelunasan";
        body.innerHTML = `<p class="text-red-500 font-bold">Tagihan: Rp ${sisaAwal.toLocaleString()}</p><select id="v-met-p"><option value="Tunai">Tunai</option><option value="Transfer">Transfer</option></select><input id="v-pel" type="number" placeholder="Nominal Bayar (Rp)">`;
        btn.onclick = async () => {
            const { data: cur } = await supabase.from('servis').select('uang_muka').eq('id', id).single();
            const baru = parseInt(cur.uang_muka) + parseInt(document.getElementById('v-pel').value || 0);
            await supabase.from('servis').update({ uang_muka: baru, metode_bayar: document.getElementById('v-met-p').value }).eq('id', id);
            window.closeModal(); window.loadAll();
        };
    };

    window.printNotaFull = async (id) => {
        const { data: s } = await supabase.from('servis').select('*, kendaraan(*, pelanggan(*))').eq('id', id).single();
        
        const t = new Date(s.created_at);
        const jasa = parseInt(s.jasa_service || 0);
        const part = parseInt(s.biaya_sparepart || 0);
        const total = jasa + part;
        const bayar = parseInt(s.uang_muka || 0);
        const sisa = total - bayar;

        // Memecah teks rincian agar muncul per baris dengan bullet point
        const listBarang = s.nama_sparepart_manual ? s.nama_sparepart_manual.split(" | ").map(item => `
            <div style="display: flex; justify-content: space-between; border-bottom: 1px dashed #eee; padding: 2px 0;">
                <span style="flex: 1;">• ${item.split(' (')[0]}</span>
                <span style="white-space: nowrap; margin-left: 10px;">${item.includes('(') ? item.split(' (')[1].replace(')', '') : ''}</span>
            </div>`).join("") : "-";

        document.getElementById('print-area').innerHTML = `
            <div style="font-family:monospace; padding:10px; width:280px; color:#000; margin:auto; line-height: 1.2;">
                <center>
                    <h2 style="margin:0; letter-spacing: 2px;">JE GARAGE</h2>
                    <p style="font-size:10px; margin: 5px 0;">${t.toLocaleDateString()} | ${t.toLocaleTimeString()}</p>
                </center>
                
                <hr style="border-top:1px solid #000">
                <table width="100%" style="font-size:11px; margin-bottom: 5px;">
                    <tr><td width="30%">Unit</td><td>: <b>${s.kendaraan?.plat}</b></td></tr>
                    <tr><td>Pemilik</td><td>: ${s.kendaraan?.pelanggan?.nama || '-'}</td></tr>
                    <tr><td>Kerja</td><td>: ${s.keluhan || '-'}</td></tr>
                </table>
                
                <div style="font-size:10px; border-top: 1px solid #000; padding-top: 5px;">
                    <b>RINCIAN PART & HARGA:</b>
                    <div style="margin-top: 5px;">${listBarang}</div>
                </div>

                <div style="margin-top: 10px; border-top: 1px solid #000; padding-top: 5px;">
                    <table width="100%" style="font-size:11px;">
                        <tr>
                            <td>Biaya Jasa Servis</td>
                            <td align="right">Rp ${jasa.toLocaleString()}</td>
                        </tr>
                        <tr style="border-bottom: 1px solid #eee;">
                            <td>Total Biaya Part</td>
                            <td align="right">Rp ${part.toLocaleString()}</td>
                        </tr>
                        <tr style="font-weight:bold; font-size:13px;">
                            <td style="padding-top: 5px;">TOTAL AKHIR</td>
                            <td align="right" style="padding-top: 5px;">Rp ${total.toLocaleString()}</td>
                        </tr>
                        <tr>
                            <td style="font-size: 10px;">Bayar (${s.metode_bayar})</td>
                            <td align="right" style="font-size: 10px;">Rp ${bayar.toLocaleString()}</td>
                        </tr>
                        <tr style="font-weight:bold;">
                            <td>${sisa > 0 ? 'SISA TAGIHAN' : 'STATUS'}</td>
                            <td align="right" style="color: ${sisa > 0 ? 'red' : 'black'};">
                                ${sisa > 0 ? 'Rp ' + sisa.toLocaleString() : 'LUNAS'}
                            </td>
                        </tr>
                    </table>
                </div>

                <hr style="border-top:1px dashed #000; margin-top: 15px;">
                <center><p style="font-size:9px;">Terima Kasih Telah Berkunjung</p></center>
            </div>`;
        window.print();
    };
    window.closeModal=()=>{ document.getElementById('modal-container').classList.add('hidden'); keranjang=[]; };
    window.hapus=async(t,id)=>{ if(confirm("Hapus Permanen?")){ await supabase.from(t).delete().eq('id',id); window.loadAll(); } };
</script>
</body>
</html>
