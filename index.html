<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Je Garage Pro v.1 FULL FITUR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #262626; color: #fff; margin: 0; -webkit-tap-highlight-color: transparent; }
        body::before { content: ""; position: fixed; inset: 0; background: url('https://i.postimg.cc/xCDV3vRZ/car-automobile-repair-shop-engine-motor-vehicle-service-maintenance-auto-parts-6c3120919a9a891118831.png') center/cover; opacity: 0.15; z-index: -1; }
        .orange-gradient { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
        .card-dark { background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .tab.active { color: #f97316; border-bottom: 3px solid #f97316; opacity: 1; }
        .tab { opacity: 0.4; cursor: pointer; padding-bottom: 10px; font-weight: 800; text-transform: uppercase; font-size: 11px; }
        input, select { background: rgba(30, 30, 30, 0.9) !important; color: white !important; border: 1px solid #444 !important; padding: 14px; border-radius: 12px; width: 100%; outline: none; }
        .hidden { display: none !important; }
        @media print {
            body { background: none !important; color: #000 !important; }
            #dashboard-content, #modal-container, #login-screen, nav, header, button { display: none !important; }
            #print-area { display: block !important; width: 100%; color: #000 !important; }
        }
    </style>
</head>
<body class="pb-24">

<div id="login-screen" class="fixed inset-0 bg-[#050505] z-[1000] flex flex-col items-center justify-center p-6">
    <h2 class="text-xl font-black text-orange-500 uppercase italic mb-8">Je Garage Pro</h2>
    <input type="password" id="pass-input" placeholder="PASSWORD" class="text-center font-bold tracking-[0.5em] max-w-xs mb-4">
    <button onclick="window.eksekusiLogin()" class="orange-gradient w-full max-w-xs py-4 rounded-xl font-black text-xs uppercase shadow-lg">Login</button>
</div>

<div id="print-area" class="hidden"></div>

<div id="dashboard-content" class="hidden max-w-4xl mx-auto p-4">
    <header class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-orange-500 rounded-xl flex items-center justify-center"><i class="fa-solid fa-car-side text-white text-xl"></i></div>
            <div><h1 class="text-lg font-black italic text-orange-500 uppercase leading-none">Je Garage</h1><p class="text-[7px] text-zinc-500 font-bold uppercase mt-1">V.1 FULL FITUR</p></div>
        </div>
        <div class="flex gap-2">
            <button onclick="window.loadAll()" class="w-10 h-10 rounded-xl bg-zinc-900 border border-zinc-800 text-orange-500"><i class="fa-solid fa-sync"></i></button>
            <button onclick="window.eksekusiLogout()" class="w-10 h-10 rounded-xl bg-zinc-900 border border-zinc-800 text-red-500"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <nav class="flex gap-6 border-b border-zinc-900 mb-8 overflow-x-auto no-scrollbar">
        <div id="btn-tab-database" onclick="window.switchTab('tab-database')" class="tab active">Database</div>
        <div id="btn-tab-servis" onclick="window.switchTab('tab-servis')" class="tab">Workshop</div>
        <div id="btn-tab-stok" onclick="window.switchTab('tab-stok')" class="tab">Gudang</div>
        <div id="btn-tab-finance" onclick="window.switchTab('tab-finance')" class="tab">Laporan</div>
    </nav>

    <div id="tab-database" class="tab-content">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="card-dark p-5 rounded-[2rem]">
                <button onclick="window.openModal('pelanggan')" class="orange-gradient w-full py-4 rounded-2xl font-black mb-6 text-[10px] uppercase shadow-lg">+ Pelanggan</button>
                <div id="list-pelanggan" class="space-y-3 max-h-[300px] overflow-y-auto"></div>
            </div>
            <div class="card-dark p-5 rounded-[2rem]">
                <button onclick="window.openModal('kendaraan')" class="bg-zinc-800 w-full py-4 rounded-2xl font-black mb-6 text-[10px] uppercase border border-zinc-700">+ Unit Baru</button>
                <div id="list-kendaraan" class="space-y-3 max-h-[300px] overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <div id="tab-servis" class="tab-content hidden">
        <input type="text" id="search-ws" placeholder="Cari Plat..." oninput="window.renderWorkshop()" class="text-xs italic mb-4">
        <div id="list-pro-workshop" class="space-y-4"></div>
    </div>

    <div id="tab-stok" class="tab-content hidden">
        <button onclick="window.openModal('stok')" class="bg-blue-600 w-full py-4 rounded-2xl font-black mb-6 text-[10px] uppercase">+ Stok Barang</button>
        <div class="grid grid-cols-2 gap-4" id="list-stok"></div>
    </div>

    <div id="tab-finance" class="tab-content hidden">
        <div class="flex gap-2 mb-6">
            <select id="filter-finance" onchange="window.updateFinanceUI()" class="text-[10px] flex-1">
                <option value="hari">Hari Ini</option>
                <option value="bulan">Bulan Ini</option>
                <option value="semua">Semua</option>
            </select>
            <button onclick="window.openModal('tambah_modal')" class="bg-emerald-600 px-3 rounded-xl text-[9px] font-bold uppercase shadow-lg">+ Modal</button>
            <button onclick="window.openModal('pengeluaran')" class="bg-red-600 px-4 rounded-xl text-[9px] font-bold uppercase">Biaya</button>
        </div>
        <div id="jurnal-summary-area" class="mb-6"></div>
        <div class="space-y-4">
            <div class="card-dark rounded-3xl p-5 border-l-4 border-emerald-500">
                <h3 class="text-[9px] font-black text-emerald-500 uppercase mb-4 italic">Pemasukan</h3>
                <div id="jurnal-in-body" class="space-y-2 text-[10px]"></div>
            </div>
            <div class="card-dark rounded-3xl p-5 border-l-4 border-red-500">
                <h3 class="text-[9px] font-black text-red-500 uppercase mb-4 italic">Pengeluaran</h3>
                <div id="jurnal-out-body" class="space-y-2 text-[10px]"></div>
            </div>
        </div>
    </div>
</div>

<div id="modal-container" class="fixed inset-0 bg-black/95 hidden flex items-center justify-center p-4 z-[100] backdrop-blur-md">
    <div class="card-dark w-full max-w-lg p-6 rounded-[2rem] shadow-2xl overflow-y-auto max-h-[90vh]">
        <h3 id="modal-title" class="text-lg font-bold text-orange-500 mb-6 uppercase italic"></h3>
        <div id="modal-body" class="space-y-4"></div>
        <div class="flex flex-col gap-2 mt-8">
            <button id="btn-execute" class="orange-gradient py-4 rounded-xl font-black text-xs uppercase tracking-widest">Simpan Data</button>
            <button onclick="window.closeModal()" class="bg-zinc-900 py-4 rounded-xl font-bold text-xs text-zinc-500 uppercase">Batal</button>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
    const SB_URL = "https://lxbfgnobjaqxojggjonh.supabase.co", 
          SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVC9J.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4YmZnbm9iamFxeG9qZ2dqb25oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0MjIxMDUsImV4cCI6MjA5MTk5ODEwNX0.GbY962sK8VFCShqlvW7olRnWtJMkLlr3f1NuSc2kV6E";
    const supabase = createClient(SB_URL, SB_KEY);
    const MASTER_PASS = "cuma123"; 
    let keranjang = [], masterS = [], masterE = [], masterST = [];

    window.eksekusiLogin = () => { 
        if(document.getElementById('pass-input').value === MASTER_PASS) { 
            localStorage.setItem('garage_session', 'active'); 
            location.reload(); 
        } else { alert("Password salah!"); }
    };
    
    window.eksekusiLogout = () => { 
        if(confirm("Keluar?")) { localStorage.removeItem('garage_session'); location.reload(); } 
    };

    if(localStorage.getItem('garage_session') === 'active') { 
        document.getElementById('login-screen').classList.add('hidden'); 
        document.getElementById('dashboard-content').classList.remove('hidden'); 
        setTimeout(() => window.loadAll(), 300); 
    }

    window.switchTab = (id) => { 
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden')); 
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); 
        document.getElementById(id).classList.remove('hidden'); 
        document.getElementById('btn-'+id).classList.add('active'); 
    };

    window.loadAll = async () => {
        const { data: p } = await supabase.from('pelanggan').select('*').order('created_at', {ascending: false});
        const { data: k } = await supabase.from('kendaraan').select('*, pelanggan(*)').order('created_at', {ascending: false});
        const { data: s } = await supabase.from('servis').select('*, kendaraan(*, pelanggan(*))').order('created_at', {ascending: false});
        const { data: st } = await supabase.from('stok_sparepart').select('*');
        const { data: ex } = await supabase.from('pengeluaran').select('*').order('created_at', {ascending: false});
        
        masterS = s || []; masterE = ex || []; masterST = st || [];
        
        document.getElementById('list-pelanggan').innerHTML = p.map(i => `
            <div class="bg-zinc-900 p-3 rounded-xl flex justify-between items-center text-sm mb-2 border border-zinc-800">
                <div><p class="font-bold text-orange-500">${i.nama}</p><p class="text-[10px] text-zinc-400">${i.no_hp || '-'}</p></div>
                <button onclick="window.hapus('pelanggan','${i.id}')" class="text-zinc-700 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
            </div>`).join('');

        document.getElementById('list-kendaraan').innerHTML = k.map(i => `
            <div class="bg-zinc-900/40 p-3 rounded-xl flex justify-between items-center border border-zinc-900 mb-2">
                <div><p class="text-xs font-bold text-orange-500">${i.plat}</p><p class="text-[9px] text-zinc-400">${i.pelanggan?.nama || '-'}</p></div>
                <button onclick="window.openModal('servis', '${i.id}')" class="bg-orange-600/10 text-orange-500 px-3 py-2 rounded-lg text-[9px] font-black uppercase">Servis</button>
            </div>`).join('');

        document.getElementById('list-stok').innerHTML = masterST.map(i => `
            <div class="card-dark p-3 rounded-2xl border-l-4 border-blue-500 flex justify-between items-center">
                <div><p class="text-[8px] text-zinc-500 uppercase">${i.nama_barang}</p><h4 class="text-base font-black">${i.jumlah_stok}</h4></div>
            </div>`).join('');

        window.renderWorkshop(); window.updateFinanceUI();
    };

    window.renderWorkshop = () => {
        const q = document.getElementById('search-ws').value.toUpperCase();
        const f = masterS.filter(x => x.kendaraan?.plat?.toUpperCase().includes(q));
        document.getElementById('list-pro-workshop').innerHTML = f.map(x => {
            const sisa = (parseInt(x.jasa_service||0) + parseInt(x.biaya_sparepart||0)) - parseInt(x.uang_muka||0);
            return `
            <div class="card-dark p-5 rounded-[1.5rem] border-l-4 ${sisa > 0 ? 'border-red-600' : 'border-emerald-600'}">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="text-lg font-black text-orange-500 italic">${x.kendaraan?.plat || 'N/A'}</h3>
                        <p class="text-[9px] text-zinc-500 uppercase">${x.kendaraan?.pelanggan?.nama || '-'}</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="window.sendWA('${x.id}')" class="text-emerald-500 text-lg"><i class="fa-brands fa-whatsapp"></i></button>
                        <button onclick="window.printNotaFull('${x.id}')" class="text-orange-500 text-lg"><i class="fa-solid fa-print"></i></button>
                    </div>
                </div>
                ${x.foto_url ? `<img src="${x.foto_url}" class="w-full h-32 object-cover rounded-xl mt-3 border border-zinc-800">` : ''}
                <p class="text-[9px] text-zinc-400 mt-2 italic">Kerja: ${x.keluhan || '-'}</p>
                <div class="mt-3 flex justify-between items-center pt-3 border-t border-white/5">
                    <span class="text-[10px] font-black italic ${sisa > 0 ? 'text-red-500' : 'text-emerald-500'}">${sisa > 0 ? 'BELUM LUNAS' : 'LUNAS'}</span>
                    <p class="font-black text-xs">Sisa: Rp ${sisa.toLocaleString()}</p>
                </div>
            </div>`;
        }).join('');
    };

    window.sendWA = async (id) => {
        const { data: s } = await supabase.from('servis').select('*, kendaraan(*, pelanggan(*))').eq('id', id).single();
        if(!s || !s.kendaraan?.pelanggan?.no_hp) return alert("No HP tidak ada!");
        const total = (parseInt(s.jasa_service||0) + parseInt(s.biaya_sparepart||0));
        const sisa = total - parseInt(s.uang_muka||0);
        let hp = s.kendaraan.pelanggan.no_hp.replace(/[^0-9]/g, '');
        if(hp.startsWith('0')) hp = '62' + hp.slice(1);
        const msg = `*JE GARAGE - NOTA SERVIS*%0AUnit: ${s.kendaraan.plat}%0A------------------%0APekerjaan: ${s.keluhan}%0ATotal: Rp ${total.toLocaleString()}%0ABayar: Rp ${parseInt(s.uang_muka).toLocaleString()}%0ASisa: Rp ${sisa.toLocaleString()}%0A%0ATerima Kasih!`;
        window.open(`https://wa.me/${hp}?text=${msg}`, '_blank');
    };

    window.updateFinanceUI = () => {
        const f = document.getElementById('filter-finance').value;
        const now = new Date();
        const fS = masterS.filter(x => { 
            const d = new Date(x.created_at);
            if(f==='hari') return d.toDateString() === now.toDateString();
            if(f==='bulan') return d.getMonth() === now.getMonth();
            return true;
        });
        const totalIn = fS.reduce((a,b) => a + parseInt(b.uang_muka||0), 0);
        document.getElementById('jurnal-summary-area').innerHTML = `<div class="card-dark p-6 rounded-[2rem] border-l-4 border-emerald-500"><p class="text-[8px] text-zinc-500 uppercase">Pemasukan (${f})</p><h2 class="text-2xl font-black text-emerald-500">Rp ${totalIn.toLocaleString()}</h2></div>`;
        document.getElementById('jurnal-in-body').innerHTML = fS.map(x => `<div class="flex justify-between border-b border-white/5 pb-2"><span>${x.kendaraan?.plat}</span><span class="font-bold">Rp ${parseInt(x.uang_muka).toLocaleString()}</span></div>`).join('');
    };

    window.openModal = async (type, id = null) => {
        const b = document.getElementById('modal-body'), t = document.getElementById('modal-title'), btn = document.getElementById('btn-execute');
        document.getElementById('modal-container').classList.remove('hidden');
        
        if(type==='servis'){
            t.innerText="Workshop Input"; 
            b.innerHTML=`
                <input id="s-kel" placeholder="Pekerjaan / Keluhan">
                <input id="s-foto" placeholder="Link Foto Unit (Opsional)">
                <input id="s-jasa" type="number" placeholder="Jasa (Rp)">
                <div id="bsk" class="text-[10px] text-zinc-400"></div>
                <input id="s-bayar" type="number" placeholder="Bayar Sekarang (Rp)">
                <select id="s-met"><option value="Tunai">Tunai</option><option value="Transfer">Transfer</option></select>`;
            btn.onclick = async () => {
                await supabase.from('servis').insert([{
                    kendaraan_id: id, keluhan: document.getElementById('s-kel').value, 
                    foto_url: document.getElementById('s-foto').value,
                    jasa_service: document.getElementById('s-jasa').value, 
                    uang_muka: document.getElementById('s-bayar').value,
                    metode_bayar: document.getElementById('s-met').value
                }]);
                window.closeModal(); window.loadAll();
            };
        } else if(type==='pelanggan'){
            t.innerText="Pelanggan Baru";
            b.innerHTML=`<input id="p-n" placeholder="Nama"><input id="p-h" placeholder="No WhatsApp">`;
            btn.onclick=async()=>{
                await supabase.from('pelanggan').insert([{nama:document.getElementById('p-n').value, no_hp:document.getElementById('p-h').value}]);
                window.closeModal(); window.loadAll();
            }
        } else if(type==='kendaraan'){
            const { data: pl } = await supabase.from('pelanggan').select('*');
            t.innerText="Unit Baru";
            b.innerHTML=`<select id="p-id">${pl.map(x=>`<option value="${x.id}">${x.nama}</option>`)}</select><input id="p-plat" placeholder="Plat Nomor">`;
            btn.onclick=async()=>{
                await supabase.from('kendaraan').insert([{pelanggan_id:document.getElementById('p-id').value, plat:document.getElementById('p-plat').value.toUpperCase()}]);
                window.closeModal(); window.loadAll();
            }
        }
    };

    window.printNotaFull = async (id) => {
        const { data: s } = await supabase.from('servis').select('*, kendaraan(*, pelanggan(*))').eq('id', id).single();
        const total = (parseInt(s.jasa_service||0) + parseInt(s.biaya_sparepart||0));
        document.getElementById('print-area').innerHTML = `<div style="font-family:monospace; padding:20px; color:#000;"><h2>JE GARAGE</h2><p>Unit: ${s.kendaraan.plat}</p><p>Total: Rp ${total.toLocaleString()}</p></div>`;
        window.print();
    };

    window.closeModal = () => { document.getElementById('modal-container').classList.add('hidden'); };
    window.hapus = async (t, id) => { if(confirm("Hapus?")) { await supabase.from(t).delete().eq('id', id); window.loadAll(); } };
</script>
</body>
</html>
